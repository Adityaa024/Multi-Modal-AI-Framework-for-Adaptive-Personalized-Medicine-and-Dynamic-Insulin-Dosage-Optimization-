services:
  - type: web
    name: project5-api
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python scripts/generate_synthetic_t2d_data.py
      python scripts/train_severity_model.py
      python scripts/train_dosage_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://project5-frontend.onrender.com

  - type: web
    name: project5-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://project5-api.onrender.com
